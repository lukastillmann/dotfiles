##### PREFIX #####

# Use Ctrl-a instead of Ctrl-b
unbind C-b
set -g prefix C-a
bind C-a send-prefix


##### TERMINAL / COLORS #####

# Prefer tmux's own terminfo on modern systems
# If a remote machine does not have tmux-256color installed,
# switch this back to: screen-256color
set -g default-terminal "tmux-256color"

# Truecolor support for terminals that need terminal-features
# Safe on modern tmux
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",screen-256color:RGB"
set -as terminal-features ",tmux-256color:RGB"


##### KEYBOARD / MODIFIER KEYS #####

# Modern extended key support
set -s extended-keys on
set -g extended-keys-format csi-u

# xterm-keys is legacy and usually unnecessary with modern extended keys,
# so it is intentionally omitted.


##### GENERAL BEHAVIOR #####

# vi keys in copy mode
setw -g mode-keys vi

# Start numbering at 1
set -g base-index 1
setw -g pane-base-index 1

# Enable mouse
set -g mouse on

# macOS clipboard integration
set -s set-clipboard off


##### RELOAD CONFIG #####

bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"


##### COPY MODE #####

# Enter copy mode with Escape
unbind [
bind Escape copy-mode

# Paste tmux buffer with prefix + p
unbind p
bind p paste-buffer

# Vim-style selection in copy mode
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"


##### PANE NAVIGATION #####

# Smart pane switching with awareness of Vim/Neovim
# Based on vim-tmux-navigator style logic
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

bind-key -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind-key -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind-key -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind-key -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"

# Optional: last pane on Ctrl-\
# bind-key -n C-\\ if-shell "$is_vim" "send-keys C-\\" "select-pane -l"


##### SPLITS #####

# Split panes in current directory
bind-key h split-window -h -c "#{pane_current_path}"
bind-key j split-window -v -c "#{pane_current_path}"
bind-key k split-window -v -c "#{pane_current_path}"
bind-key l split-window -h -c "#{pane_current_path}"


##### RESIZE PANES #####

bind -n S-Left  resize-pane -L 2
bind -n S-Right resize-pane -R 2
bind -n S-Up    resize-pane -U 1
bind -n S-Down  resize-pane -D 1


##### APPEARANCE #####

# Highlight active pane a bit
set -g window-active-style 'bg=#003533'


##### PLUGINS #####

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'seebi/tmux-colors-solarized'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'akohlbecker/aw-watcher-tmux'

# Optional plugins you had commented out before:
# set -g @plugin 'tmux-plugins/tmux-continuum'
# set -g @plugin 'christoomey/vim-tmux-navigator'

# Optional theme setting
# set -g @colors-solarized 'dark'

# Optional resurrect bindings
# bind C-s run-shell ~/.tmux/plugins/tmux-resurrect/scripts/save.sh
# bind C-r run-shell ~/.tmux/plugins/tmux-resurrect/scripts/restore.sh

# Optional continuum settings
# set -g @continuum-restore 'on'
# set -g @continuum-save-interval '15'
# set -g status-right 'Continuum status: #{continuum_status}'

# Claude Session
bind-key C-g display-popup -E -w 50% -h 50% -d '#{pane_current_path}' 'claude-session'
bind-key C-f display-popup -E -w 50% -h 50% \
  'tmux list-sessions | grep "^claude-" | cut -d: -f1 | sed "s/^claude-//" | fzf --prompt="Switch > " | xargs -I{} tmux switch-client -t "claude-{}"'


##### TPM #####

# Keep this at the very bottom
run -b '~/.tmux/plugins/tpm/tpm'
